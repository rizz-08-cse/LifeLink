<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bloodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#0f172a" stroke="#dc2626" stroke-width="2.5" />
  <!-- Blood Droplet -->
  <path d="M50 16 C50 16 28 44 28 62 C28 74.15 37.85 84 50 84 C62.15 84 72 74.15 72 62 C72 44 50 16 50 16 Z" fill="url(#bloodGrad)" filter="url(#glow)" />
  <!-- ECG Heartbeat Line -->
  <path d="M34 63 L41 63 L45 53 L49 71 L54 57 L58 65 L66 65" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Cross accent -->
  <circle cx="68" cy="30" r="5" fill="#ef4444" opacity="0.8" />
  <path d="M68 27 L68 33 M65 30 L71 30" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
</svg>
